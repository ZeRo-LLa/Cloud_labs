services:
  db:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-f1}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Скопіюй .env.example у .env і задай пароль}
      POSTGRES_DB: ${POSTGRES_DB:-f1}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-f1} -d ${POSTGRES_DB:-f1}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build: .
    environment:
      PORT: 5005
      DATABASE_URL: postgres://${POSTGRES_USER:-f1}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-f1}
      REDIS_URL: redis://redis:6379
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-30}
      CACHE_INVALIDATE_ON_WRITE: ${CACHE_INVALIDATE_ON_WRITE:-false}
    ports:
      - "5005:5005"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
